name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build packages and installer
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then scripts/build.sh "${GITHUB_REF_NAME#v}"; else scripts/build.sh; fi
      - uses: actions/upload-artifact@v4
        with:
          name: jimsvpn
          path: dist/
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
